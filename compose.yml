# ⚠️ 目前这份 compose.yml 仅供参考/构建镜像用（`podman compose build`），
# 不能用它 `up` 这个容器：容器必须用 `podman run --systemd=always ...` 启动
# （PID 1 是系统级 systemd，不加 --systemd=always 的话 /sys/fs/cgroup 是只读的，
# 容器起不来），标准 compose schema 没有对应 --systemd 的字段。
# 实际启动步骤见 README.md。
version: '3.8'

services:
  openclaw-vnc:
    build: .
    image: openclaw-vnc:ubuntu26.04
    container_name: openclaw
    ports:
      - "5901:5901"
      - "18789:18789"
    volumes:
      - ./data:/mnt
      - ./openclaw_data:/home/node/.openclaw
      # 持久化 openclaw gateway 的 systemd user unit（openclaw gateway install
      # 写在 ~/.config 下，不在 ~/.openclaw 里，不额外挂载的话每次重建容器都要
      # 重新 openclaw gateway install）
      - ./openclaw_systemd_user:/home/node/.config/systemd/user
    # 保持容器后台运行的策略
    restart: unless-stopped
